<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Digital – Home</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .hero {
      background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg) 100%);
      padding: 4rem 2rem;
      text-align: center;
      border-radius: 1rem;
      margin: 2rem 0;
    }
    .hero h1 {
      font-size: 3rem;
      color: var(--text);
    }
    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 1rem auto;
    }
    .cta-button {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: var(--primary);
      color: #fff;
      border-radius: 2rem;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s;
    }
    .cta-button:hover {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <section class="hero">
      <h1>Welcome to Apex Digital</h1>
      <p>Empowering businesses with innovative digital solutions.</p>
      <p> Build smarter, grow faster.</p>
      <a href="services.html" class="cta-button">Explore Our Services</a>
      <div style="margin-top:2rem;">
        <img src="assets/logo.svg" alt="Apex Digital Logo" width="120" height="120" />
      </div>
    </section>
    <section style="padding:2rem;">
      <h2>Why Apex Digital?</h2>
      <ul>
        <li>15+ years of industry experience</li>
        <li>Tailored solutions for every client</li>
        <li>Cutting‑edge technology stack</li>
        <li>Dedicated 24/7 support</li>
      </ul>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/theme.js"></script>
  <script src="js/components.js"></script>
</body>
</html>
